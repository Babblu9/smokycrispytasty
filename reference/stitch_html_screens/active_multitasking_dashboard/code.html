<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sous Chef - Split-timer Dashboard</title>

                      "on-secondary": "#ffffff",
                      "on-primary-container": "#fffbff",
                      "outline-variant": "#e0c0b2",
                      "secondary-fixed": "#ffddb9",
                      "tertiary-fixed": "#d8e2ff",
                      "secondary": "#865300",

                      "on-background": "#251913",
                      "surface-dim": "#edd5cc",
                      "tertiary-container": "#0070ec",
                      "on-secondary-fixed": "#2b1700",
                      "surface-bright": "#fff8f6",
                      "error": "#ba1a1a",
                      "surface": "#fff8f6",
                      "tertiary": "#0058bd",
                      "on-primary-fixed-variant": "#7c2e00",
                      "on-primary-fixed": "#351000",
                      "on-secondary-container": "#694000",
                      "primary-fixed": "#ffdbcd",
                      "surface-tint": "#a23f00",
                      "on-tertiary-fixed": "#001a41",

                      "error-container": "#ffdad6",
                      "outline": "#8c7166",
                      "tertiary-fixed-dim": "#adc6ff",
                      "surface-variant": "#f6ddd4",
                      "surface-container-high": "#fce3da",
                      "on-error-container": "#93000a",
                      "primary-container": "#c64f00",
                      "on-surface": "#251913",
                      "primary-fixed-dim": "#ffb595"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "sm": "16px",
                      "lg": "40px",
                      "base": "4px",
                      "xl": "64px",
                      "margin-mobile": "20px",
                      "gutter": "16px",
                      "md": "24px",
                      "xs": "8px"
              },
              "fontFamily": {
                      "headline-lg": [
                              "Inter"
                      ],
                      "label-sm": [
                              "JetBrains Mono"
                      ],
                      "headline-md": [

                      "headline-lg-mobile": [

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background antialiased min-h-screen flex flex-col font-body-md">
<!-- TopAppBar -->
<header class="w-full top-0 sticky border-b-2 border-on-background bg-surface dark:bg-on-background text-primary dark:text-inverse-primary font-headline-md text-headline-md flex justify-between items-center px-margin-mobile h-16 z-40 flat no shadows">
<button class="material-symbols-outlined text-primary dark:text-inverse-primary hover:bg-surface-container-high active:translate-y-[2px] transition-all p-2 rounded-DEFAULT">menu</button>
<span class="font-headline-md text-headline-md font-bold text-primary">Sous Chef</span>
<button class="material-symbols-outlined text-primary dark:text-inverse-primary hover:bg-surface-container-high active:translate-y-[2px] transition-all p-2 rounded-DEFAULT">timer</button>
</header>
<main class="flex-grow p-margin-mobile md:px-xl flex flex-col gap-lg pb-32">
<!-- Total Progress Tracker -->
<section class="flex flex-col gap-sm">
<h2 class="font-headline-md text-headline-md md:font-headline-lg md:text-headline-lg">Meal Timeline</h2>
<div class="w-full bg-surface-container-highest border-2 border-on-background h-8 rounded-DEFAULT relative overflow-hidden">
<div class="absolute top-0 left-0 h-full bg-secondary-container w-3/5 border-r-2 border-on-background flex items-center justify-end pr-sm">
<span class="font-label-bold text-label-bold text-on-secondary-container">25m Left</span>
</div>
</div>
</section>
<!-- Stacked Card Modules -->
<section class="flex flex-col gap-md">
<!-- Boiling Pasta Card -->
<article class="bg-surface-container-lowest border-2 border-on-background shadow-[4px_4px_0px_0px_#1A1A1A] rounded-DEFAULT overflow-hidden flex flex-col">
<div class="h-2 bg-secondary-container w-full border-b-2 border-on-background"></div>
<div class="p-sm flex flex-col md:flex-row gap-sm items-start md:items-center justify-between">
<div class="flex flex-col gap-xs flex-grow">
<h3 class="font-headline-md text-headline-md">Boiling Pasta</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Stir occasionally. Keep at a rolling boil.</p>
</div>
<div class="flex items-center gap-sm self-end md:self-auto">
<div class="w-20 h-20 rounded-full border-4 border-secondary-container flex items-center justify-center font-label-bold text-label-bold text-headline-md bg-surface">
                            08:30
                        </div>
<div class="flex flex-col gap-base">
<button class="h-12 px-sm bg-surface border-2 border-on-background font-label-bold text-label-bold active:translate-y-[2px] active:shadow-none shadow-[2px_2px_0px_0px_#1A1A1A] rounded-DEFAULT transition-all flex items-center justify-center gap-xs">
<span class="material-symbols-outlined text-[20px]">pause</span> Pause
                            </button>
<button class="h-12 px-sm bg-surface border-2 border-on-background font-label-bold text-label-bold active:translate-y-[2px] active:shadow-none shadow-[2px_2px_0px_0px_#1A1A1A] rounded-DEFAULT transition-all flex items-center justify-center gap-xs">
<span class="material-symbols-outlined text-[20px]">add</span> 1 Min
                            </button>
</div>
</div>
</div>
</article>
<!-- Simmering Sauce Card -->
<article class="bg-surface-container-lowest border-2 border-on-background shadow-[4px_4px_0px_0px_#1A1A1A] rounded-DEFAULT overflow-hidden flex flex-col">
<div class="h-2 bg-secondary-container w-full border-b-2 border-on-background"></div>
<div class="p-sm flex flex-col md:flex-row gap-sm items-start md:items-center justify-between">
<div class="flex flex-col gap-xs flex-grow">
<h3 class="font-headline-md text-headline-md">Simmering Sauce</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Reduce heat to low. Cover partially.</p>
</div>
<div class="flex items-center gap-sm self-end md:self-auto">
<div class="w-20 h-20 rounded-full border-4 border-secondary-container flex items-center justify-center font-label-bold text-label-bold text-headline-md bg-surface">
                            15:45
                        </div>
<div class="flex flex-col gap-base">
<button class="h-12 px-sm bg-surface border-2 border-on-background font-label-bold text-label-bold active:translate-y-[2px] active:shadow-none shadow-[2px_2px_0px_0px_#1A1A1A] rounded-DEFAULT transition-all flex items-center justify-center gap-xs">
<span class="material-symbols-outlined text-[20px]">pause</span> Pause
                            </button>
<button class="h-12 px-sm bg-surface border-2 border-on-background font-label-bold text-label-bold active:translate-y-[2px] active:shadow-none shadow-[2px_2px_0px_0px_#1A1A1A] rounded-DEFAULT transition-all flex items-center justify-center gap-xs">
<span class="material-symbols-outlined text-[20px]">add</span> 1 Min
                            </button>
</div>
</div>
</div>
</article>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 h-20 bg-surface dark:bg-on-background border-t-2 border-on-background flex justify-around items-center px-gutter flat no shadows md:hidden">
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-variant active:translate-y-[4px] active:shadow-none transition-all rounded-DEFAULT">
<span class="material-symbols-outlined font-headline-md text-headline-md text-secondary dark:text-secondary-fixed-dim">restaurant_menu</span>
<span class="font-label-bold text-label-bold">Recipes</span>
</button>
<button class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-xl p-2 border-2 border-on-background shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] hover:bg-surface-variant active:translate-y-[4px] active:shadow-none transition-all">
<span class="material-symbols-outlined font-headline-md text-headline-md text-primary">skillet</span>
<span class="font-label-bold text-label-bold">Active Cook</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-variant active:translate-y-[4px] active:shadow-none transition-all rounded-DEFAULT">
<span class="material-symbols-outlined font-headline-md text-headline-md text-secondary dark:text-secondary-fixed-dim">settings</span>
<span class="font-label-bold text-label-bold">Settings</span>
</button>
</nav>
<!-- Top Navigation for Desktop -->
<nav class="hidden md:flex justify-end gap-md px-xl py-sm border-t-2 border-on-background bg-surface fixed bottom-0 w-full z-50 h-20">
<button class="flex items-center gap-xs text-on-surface-variant p-2 hover:bg-surface-variant active:translate-y-[4px] transition-all rounded-DEFAULT">
<span class="material-symbols-outlined">restaurant_menu</span>
<span class="font-label-bold text-label-bold">Recipes</span>
</button>
<button class="flex items-center gap-xs bg-secondary-container text-on-secondary-container rounded-xl p-2 border-2 border-on-background shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] hover:bg-surface-variant active:translate-y-[4px] active:shadow-none transition-all">
<span class="material-symbols-outlined">skillet</span>
<span class="font-label-bold text-label-bold">Active Cook</span>
</button>
<button class="flex items-center gap-xs text-on-surface-variant p-2 hover:bg-surface-variant active:translate-y-[4px] transition-all rounded-DEFAULT">
<span class="material-symbols-outlined">settings</span>
<span class="font-label-bold text-label-bold">Settings</span>
</button>
</nav>
</body></html>
