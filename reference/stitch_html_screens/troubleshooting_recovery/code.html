<body class="font-body-md text-on-surface">
<!-- Modal Container -->
<main class="bg-surface w-full max-w-md border-2 border-on-background shadow-[8px_8px_0px_0px_rgba(37,25,19,1)] relative overflow-hidden flex flex-col">
<!-- Header Stitch Bar -->
<div class="h-4 w-full bg-secondary-container border-b-2 border-on-background"></div>
<!-- Content Area -->
<div class="p-lg flex flex-col gap-lg">
<!-- Headline -->
<div class="flex items-start gap-md">
<span class="material-symbols-outlined text-error text-[40px]" style="font-variation-settings: 'FILL' 1;">
                    warning
                </span>
<div>
<h1 class="font-headline-xl text-headline-xl text-on-surface mb-xs">Let's fix it.</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Seems like things are heating up too quickly. Choose a quick fix below to get back on track.</p>
</div>
</div>
<!-- Action Buttons Stack -->
<div class="flex flex-col gap-md w-full">
<button class="bg-primary text-on-primary border-2 border-on-background shadow-[4px_4px_0px_0px_rgba(37,25,19,1)] active:translate-y-[4px] active:translate-x-[4px] active:shadow-none transition-all w-full min-h-[64px] flex items-center justify-between px-gutter">
<span class="font-label-bold text-label-bold">Simmer 2 mins more</span>
<span class="material-symbols-outlined">timer</span>
</button>
<button class="bg-secondary-container text-on-secondary-container border-2 border-on-background shadow-[4px_4px_0px_0px_rgba(37,25,19,1)] active:translate-y-[4px] active:translate-x-[4px] active:shadow-none transition-all w-full min-h-[64px] flex items-center justify-between px-gutter">
<span class="font-label-bold text-label-bold">Lower heat to medium</span>
<span class="material-symbols-outlined">thermostat</span>
</button>
<button class="bg-surface text-on-surface border-2 border-on-background shadow-[4px_4px_0px_0px_rgba(37,25,19,1)] active:translate-y-[4px] active:translate-x-[4px] active:shadow-none transition-all w-full min-h-[64px] flex items-center justify-between px-gutter">
<span class="font-label-bold text-label-bold">Add a splash of water</span>
<span class="material-symbols-outlined">water_drop</span>
</button>
</div>
</div>
<!-- Footer Action -->
<div class="p-gutter border-t-2 border-on-background bg-surface-variant flex justify-center">
<button class="bg-transparent border-2 border-on-background text-on-surface font-label-bold text-label-bold min-h-[48px] px-lg w-full flex items-center justify-center gap-xs active:bg-on-background active:text-surface transition-colors">
