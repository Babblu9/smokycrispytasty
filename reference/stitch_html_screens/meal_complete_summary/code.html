<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sous Chef - Meal Complete</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                        "secondary-container": "#fea520",

                        "primary": "#9e3d00",
                        "inverse-surface": "#3c2d27",

                        "on-secondary": "#ffffff",
                        "on-primary-container": "#fffbff",
                        "outline-variant": "#e0c0b2",
                        "secondary-fixed": "#ffddb9",
                        "tertiary-fixed": "#d8e2ff",

                        "surface-dim": "#edd5cc",

                        "on-secondary-fixed": "#2b1700",
                        "surface-bright": "#fff8f6",
                        "error": "#ba1a1a",
                        "surface": "#fff8f6",

                        "on-secondary-container": "#694000",
                        "primary-fixed": "#ffdbcd",

                        "surface-variant": "#f6ddd4",

                        "on-error-container": "#93000a",
                        "primary-container": "#c64f00",
                        "on-surface": "#251913",
                        "primary-fixed-dim": "#ffb595"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",

                    "spacing": {

                        "lg": "40px",

                        "margin-mobile": "20px",
                        "gutter": "16px",
                        "md": "24px",
                        "xs": "8px"
                    },
                    "fontFamily": {

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Modern Stitch Brutalism */
        .stitch-border {
            border: 2px solid #1A1A1A;
        }
        .hard-shadow {
            box-shadow: 4px 4px 0px 0px #1A1A1A;
        }
        .hard-shadow:active {
            box-shadow: 0px 0px 0px 0px #1A1A1A;
            transform: translate(4px, 4px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background antialiased min-h-screen flex flex-col items-center justify-center p-margin-mobile">
<!-- Top Navigation (Suppressed for transactional splash screen per design system rules) -->
<!-- Main Content Canvas -->
<main class="w-full max-w-lg flex flex-col gap-lg">
<!-- Header Section -->
<header class="text-center flex flex-col items-center gap-sm">
<div class="w-24 h-24 rounded-full bg-secondary-container stitch-border flex items-center justify-center hard-shadow mb-4">
<span class="material-symbols-outlined text-headline-xl" style="font-size: 48px;">local_fire_department</span>
</div>
<h1 class="font-headline-xl text-headline-xl text-on-background">Chef, your meal is served!</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Another masterpiece ready for the table.</p>
</header>
<!-- Summary Card -->
<div class="bg-surface-container-lowest stitch-border rounded-xl p-md flex flex-col gap-md relative overflow-hidden">
<!-- Stitch Header -->
<div class="absolute top-0 left-0 w-full h-2 bg-secondary-container"></div>
<h2 class="font-headline-md text-headline-md mt-2">Cook Summary</h2>
<div class="flex items-center gap-sm bg-surface p-sm stitch-border">
<span class="material-symbols-outlined text-primary" style="font-size: 32px;">timer</span>
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">Total Time</span>
<span class="font-label-bold text-label-bold text-on-background text-lg">01:45:20</span>
</div>
</div>
</div>
<!-- Kitchen Notes Text Area -->
<div class="flex flex-col gap-xs">
<label class="font-label-bold text-label-bold text-on-background uppercase tracking-widest pl-2" for="kitchen-notes">Kitchen Notes</label>
<textarea class="w-full h-32 bg-surface-container-lowest stitch-border rounded-xl p-sm font-body-md text-body-md text-on-background focus:ring-0 focus:outline-none resize-none placeholder:text-on-surface-variant/50" id="kitchen-notes" placeholder="e.g., Needs more salt next time..."></textarea>
</div>
<!-- Primary Action -->
<button class="w-full h-[64px] bg-primary stitch-border hard-shadow rounded-xl flex items-center justify-center mt-sm transition-all">
<span class="font-label-bold text-label-bold text-on-primary">Finish and Close</span>
</button>
</main>
<!-- Bottom Navigation (Suppressed for transactional splash screen per design system rules) -->
</body></html>
