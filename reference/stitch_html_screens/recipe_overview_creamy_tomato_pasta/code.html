<style>
        /* Modern Stitch Brutalism Styles */
        .stitch-card {
            border: 2px solid #1A1A1A;
            background-color: #ffffff;
        }
        .stitch-shadow {
            box-shadow: 4px 4px 0px 0px #1A1A1A;
        }
        .stitch-shadow-hover:hover {
            box-shadow: 2px 2px 0px 0px #1A1A1A;
            transform: translate(2px, 2px);
            transition: all 0.2s ease-in-out;
        }
        .stitch-shadow-active:active {
            box-shadow: 0px 0px 0px 0px #1A1A1A;
            transform: translate(4px, 4px);
            transition: all 0.1s ease-in-out;
        }
        
        /* Custom Checkbox */
        .ingredient-checkbox {
            appearance: none;
            width: 32px;
            height: 32px;
            border: 2px solid #1A1A1A;
            background-color: transparent;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .ingredient-checkbox:checked {
            background-color: #fea520; /* Saffron */
        }
        .ingredient-checkbox:checked::after {
            content: '';
            position: absolute;
            left: 10px;
            top: 4px;
            width: 8px;
            height: 16px;
            border: solid #1A1A1A;
            border-width: 0 3px 3px 0;
            transform: rotate(45deg);
        }
        .ingredient-row.checked {
            opacity: 0.6;
            border-color: #8c7166; /* outline */
        }
    </style>

<script>
        // Simple logic for ingredient checkboxes
        document.querySelectorAll('.ingredient-checkbox').forEach(checkbox => {
            checkbox.addEventListener('change', (e) => {
                const row = e.target.closest('.ingredient-row');
                if(e.target.checked) {
                    row.classList.add('checked');
                } else {
                    row.classList.remove('checked');
                }
            });
        });
    </script>
